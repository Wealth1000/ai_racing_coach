[package]
name = "ai_racing_coach"
version = "0.1.0"
edition = "2024"

# Both a library and a binary. The library target is what integration tests in
# tests/ link against — without it, no test can reach any of this code.
[lib]
name = "ai_racing_coach"
path = "src/lib.rs"

[[bin]]
name = "coach"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
