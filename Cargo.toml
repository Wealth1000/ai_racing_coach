[package]
name = "ai_racing_coach"
version = "0.1.0"
edition = "2024"

# Both a library and a binary. The library target is what integration tests in
# tests/ link against — without it, no test can reach any of this code.
[lib]
name = "ai_racing_coach"
path = "src/lib.rs"

[[bin]]
name = "coach"
path = "src/main.rs"

[dependencies]
# The GUI (Batch 15): eframe carries the windowing and event loop that bare
# egui lacks (D15 — egui alone cannot open a window). Default features give
# the glow renderer; the wgpu backend is opt-in and not wanted here, a
# driving-coach window has no use for a GPU queue.
eframe = "0.33"
clap = { version = "4.5", features = ["derive"] }
# The live pipeline's bounded channels. std::sync::mpsc cannot drop-oldest from
# the sending side (its Receiver is !Sync), and back-pressure must never reach
# the telemetry source, so the live wiring needs MPMC channels.
crossbeam-channel = "0.5"
flate2 = "1.1.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
# The voice sink's platform synthesiser. On Windows this is SAPI — in the
# OS, no system packages needed. On Linux it speaks through
# speech-dispatcher: `speech-dispatcher-devel` (headers) at build time and
# `speech-dispatcherd` + a voice module at run time. On for every default
# build: a missing backend at run time degrades to a warning and counted
# silence (see `audio::sink::TtsSink::connect`). Only a build on a machine
# without the Linux headers needs `--no-default-features`.
tts = { version = "0.26", optional = true }
# Decodes the embedded window icon (assets/icon_256.png) into the RGBA buffer
# egui wants; keeping the decode at run time means one source of truth for the
# logo instead of a checked-in byte array.
png = "0.17"

[build-dependencies]
# Embeds assets/logo.ico into the Windows executable so Explorer and the taskbar
# show the logo. Compiles no resource on other targets, so the Linux build is
# unaffected. (Maintained successor of the `winres` crate.)
winresource = "0.1"

# The AC shared-memory reader (Batch 16): OpenFileMappingW / MapViewOfFile on
# AC's three pages. Windows-only, so it never enters the Linux build — the
# cross-platform half of the reader (page structs, frame assembly) lives in
# `sims::assetto_corsa::shared_memory` and is tested everywhere.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
] }

[features]
# Speak advice through the OS synthesiser by default; `--no-default-features`
# builds a binary that cannot speak (header-less CI machines, minimal boxes).
default = ["voice"]
voice = ["dep:tts"]
